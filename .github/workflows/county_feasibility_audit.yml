name: StaLoP county feasibility audit

on:
  push:
    branches:
      - audit-county-feasibility

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r 04_realdata/code/requirements.txt
      - name: Run Georgia county-origin audit
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import numpy as np
          import pandas as pd

          sys.path.insert(0, str(Path("04_realdata/code").resolve()))
          from realdata_core import (
              RealDataConfig, build_side_panel, fit_side_model, load_binned_edges,
              metrics, predict_side_methods, target_covariates, tune_knn_k
          )

          cfg = RealDataConfig()
          edge = load_binned_edges("04_realdata/data/realdata_edge_bins.csv")
          rows = []
          all_detail = []

          for tb in cfg.target_bins:
              tr = edge[edge.tbin < tb].copy()
              te0 = edge[edge.tbin == tb].copy()

              panel = build_side_panel(tr, "origin")
              target = build_side_panel(te0, "origin")[["id","flow","y"]].copy()
              model = fit_side_model(panel, cfg, estimate_sigma2=True)
              model.side = "origin"
              cov = target_covariates(te0, "origin")

              ids = target.id.astype(str).tolist()
              ids = [i for i in ids if i in model.alpha.index]
              target = target[target.id.astype(str).isin(ids)].copy()
              target["id"] = target["id"].astype(str)

              k, _ = tune_knn_k(panel, cfg)
              preds, tune, mass, tdiag, cands = predict_side_methods(model, cov, ids, cfg, k)

              mm = target[["id","flow","y"]].copy()
              for method in ("global","time","knn","stalop"):
                  pp = preds[method].rename(columns={"value":f"pred_{method}"})
                  mm = mm.merge(pp, on="id", how="left")
              if mm.filter(like="pred_").isna().any().any():
                  raise RuntimeError(f"missing prediction at {tb}")

              mets = {m: metrics(mm.y.to_numpy(float), mm[f"pred_{m}"].to_numpy(float))
                      for m in ("global","time","knn","stalop")}
              zero_mspe = float(np.mean(mm.y.to_numpy(float)**2))
              zero_rate = float(np.mean(mm.flow.to_numpy(float) <= 0))
              rows.append({
                  "tbin": int(tb), "n": int(len(mm)), "zero_rate": zero_rate,
                  "zero_mspe": zero_mspe,
                  **{f"{m}_mspe": mets[m]["mspe"] for m in mets}
              })
              mm.insert(0,"tbin",int(tb))
              all_detail.append(mm)
              print("AUDIT_BIN", rows[-1], flush=True)

          res = pd.DataFrame(rows)
          detail = pd.concat(all_detail, ignore_index=True)

          pooled = {
              "n": int(len(detail)),
              "zero_rate": float(np.mean(detail.flow.to_numpy(float) <= 0)),
              "zero_mspe": float(np.mean(detail.y.to_numpy(float)**2)),
          }
          for method in ("global","time","knn","stalop"):
              pooled[f"{method}_mspe"] = float(np.mean((detail[f"pred_{method}"].to_numpy(float)-detail.y.to_numpy(float))**2))

          mean_bin = {"n_bins": int(len(res))}
          for col in ("zero_mspe","global_mspe","time_mspe","knn_mspe","stalop_mspe"):
              mean_bin[col] = float(res[col].mean())

          print("\n=== COUNTY_FEASIBILITY_BIN_TABLE ===")
          print(res.to_csv(index=False))
          print("=== COUNTY_FEASIBILITY_POOLED ===")
          print(pooled)
          print("=== COUNTY_FEASIBILITY_MEAN_BIN ===")
          print(mean_bin)

          winner = min(
              [(pooled["zero_mspe"],"zero"),(pooled["global_mspe"],"global"),
               (pooled["time_mspe"],"time"),(pooled["knn_mspe"],"knn"),
               (pooled["stalop_mspe"],"stalop")]
          )
          print("=== COUNTY_FEASIBILITY_WINNER ===")
          print(winner)

          Path("/tmp/county_feasibility.csv").write_text(res.to_csv(index=False))
          PY
